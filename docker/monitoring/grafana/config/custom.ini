# ******************************************************************************
# Grafana configuration for Spring Box.
#
# IMPORTANT: Never modify the pre-installed 'defaults.ini' file directly, as
# your changes will be completely overwritten during Grafana updates.
#
# To customize your Grafana instance, define your settings here in this
# 'custom.ini' file. Any values configured here will safely override the
# defaults without being lost during future upgrades.
