global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    scheme: https
    tls_config:
      insecure_skip_verify: true

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
    scrape_native_histograms: true

  - job_name: "consul-service-discovery-job"
    metrics_path: /actuator/prometheus
    consul_sd_configs:
      - server: "${CONSUL_HOST}:8500"
        scheme: "http"
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service_port] # exclude the consul node itself
        regex: "8300"
        action: drop
      - source_labels: [__scheme__]                 # spring-boot actuator endpoints use HTTPS
        regex: http
        target_label: __scheme__
        replacement: https
    tls_config:
      ca_file: ${KEYSTORE_HOME}/ca.crt
      cert_file: ${KEYSTORE_HOME}/${FQDN}.crt
      key_file: ${KEYSTORE_HOME}/${FQDN}.pem
