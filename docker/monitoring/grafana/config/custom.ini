app_mode = development
instance_name = ${HOSTNAME}
force_migration = false

#################################### Paths ####################################
[paths]
data = ${GRAFANA_STORAGE}
logs = ${GRAFANA_LOG_DIR}
plugins = ${GRAFANA_PLUGINS}
provisioning = ${GRAFANA_PROVISIONING}

#################################### Server ###################################
[server]
protocol = ${GRAFANA_PROTOCOL}
http_port = ${GRAFANA_PORT}
domain = ${FQDN}
cert_file = ${KEYSTORE_HOME}/${FQDN}.crt
cert_key = ${KEYSTORE_HOME}/${FQDN}.pem

##################################### Log #####################################
[log]
mode = file
