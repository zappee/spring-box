services:
    # ----- Private Certificate Authority Server -------------------------------
    pki:
        image: springbox-private-ca:0.8.0
        container_name: pki.${DOMAIN_NAME}
        hostname: pki.${DOMAIN_NAME}
        ports:
            - "13012:22"   # SSH
        environment:
            - EASYRSA_REQ_CN=${DOMAIN_NAME}
            - EASYRSA_REQ_COUNTRY=${EASYRSA_REQ_COUNTRY}
            - EASYRSA_REQ_PROVINCE=${EASYRSA_REQ_PROVINCE}
            - EASYRSA_REQ_CITY=${EASYRSA_REQ_CITY}
            - EASYRSA_REQ_ORG=${EASYRSA_REQ_ORG}
        networks:
            - springbox-net

    # ----- Hazelcast ----------------------------------------------------------
    hazelcast:
        image: springbox-hazelcast:0.8.0
        container_name: hazelcast.${DOMAIN_NAME}
        hostname: hazelcast.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "pki.${DOMAIN_NAME}"]
        ports:
            - "13042:22"   # SSH
            - "13043:5701"  # Hazelcast client port
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
            - HAZELCAST_CLUSTER_NAME=springbox-dev
        networks:
            - springbox-net

    # ----- HashiCorp Vault ----------------------------------------------------
    vault:
        image: springbox-vault:0.8.0
        container_name: vault.${DOMAIN_NAME}
        hostname: vault.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "pki.${DOMAIN_NAME}"]
        ports:
            - "13052:22"   # SSH
            - "13058:8200" # vault listening
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
        networks:
            - springbox-net

    # ----- HashiCorp Consul ---------------------------------------------------
    consul:
        image: springbox-consul-for-java-25:0.8.0
        container_name: consul.${DOMAIN_NAME}
        hostname: consul.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "pki.${DOMAIN_NAME}"]
        ports:
            - "13062:22"   # SSH
            - "13063:8501" # Consul UI HTTPS
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
        networks:
            - springbox-net

    # ----- Monitoring: Prometheus ---------------------------------------------
    prometheus:
        image: springbox-prometheus:0.8.0
        container_name: prometheus.${DOMAIN_NAME}
        hostname: prometheus.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "consul.${DOMAIN_NAME}"]
        ports:
            - "13072:22"   # SSH
            - "13073:9090" # HTTPS
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
            - CONSUL_HOST=consul.${DOMAIN_NAME}
        networks:
            - springbox-net

    # ----- Monitoring: Grafana ------------------------------------------------
    grafana:
        image: springbox-grafana:0.8.0
        container_name: grafana.${DOMAIN_NAME}
        hostname: grafana.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "consul.${DOMAIN_NAME}"]
        ports:
            - "13082:22"   # SSH
            - "13083:3000" # HTTPS
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
            - PROMETHEUS_HOST=prometheus.${DOMAIN_NAME}
            - GRAFANA_USER=admin
            - GRAFANA_PASSWORD=password
        networks:
            - springbox-net

    # ----- Services -----------------------------------------------------------
    echo-service:
        image: springbox-java-25-runner:0.8.0
        container_name: welcome-service.${DOMAIN_NAME}
        hostname: welcome-service.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "consul.${DOMAIN_NAME}"]
        ports:
            - "14212:22"   # SSH
            - "14213:8000" # JVM debug
            - "14214:8443" # HTTPS
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
            - CONSUL_SERVER_HOSTNAME=consul.${DOMAIN_NAME}
            - HAZELCAST_CLUSTER_NAME=springbox-dev
            - HAZELCAST_CLUSTER_MEMBERS=hazelcast-1.${DOMAIN_NAME}, hazelcast-2.${DOMAIN_NAME}
        networks:
            - springbox-net
        volumes:
            - $HOME/dev/workspace/java/remal/volumes/service-hello:/jar-to-run

    user-service:
        image: springbox-java-25-postgres-runner:0.8.0
        container_name: user-service.${DOMAIN_NAME}
        hostname: user-service.${DOMAIN_NAME}
        entrypoint: ["/wait-for-container.sh", "consul.${DOMAIN_NAME}"]
        ports:
            - "14112:22"   # SSH
            - "14113:8000" # JVM debug
            - "14114:8443" # HTTPS
            - "14115:5432" # Postgres
        environment:
            - PKI_HOST=pki.${DOMAIN_NAME}
            - CONSUL_SERVER_HOSTNAME=consul.${DOMAIN_NAME}
            - HAZELCAST_CLUSTER_NAME=springbox-dev
            - HAZELCAST_CLUSTER_MEMBERS="hazelcast-1.${DOMAIN_NAME}, hazelcast-2.${DOMAIN_NAME}"
            - START_DB=true
        networks:
            - springbox-net
        volumes:
            - $HOME/dev/workspace/java/remal/volumes/service-user:/jar-to-run
            - user-service-data:/var/lib/postgresql/data

networks:
    springbox-net:
        driver: bridge

volumes:
    user-service-data:
        driver: local
