################################################################################
# embedded web server
################################################################################
server.port=8443
server.ssl.bundle=web-server

################################################################################
# spring core
################################################################################
spring.application.name=@project.name@
spring.application.version=@project.version@

################################################################################
# log configuration
################################################################################
logging.file.name=/logs/@project.name@.log
logging.level.org.springframework.context=WARN
logging.level.org.springframework.web=WARN
logging.level.com.remal=DEBUG

################################################################################
# customize the jackson object mapper
################################################################################
spring.jackson.serialization.indent_output=true

################################################################################
# hashicorp consul
################################################################################
spring.config.import=consul:
spring.cloud.consul.host=${CONSUL_SERVER_HOSTNAME}
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.instance-id=${FQDN}
spring.cloud.consul.discovery.tags=service,${spring.application.version}
spring.cloud.consul.discovery.scheme=https
spring.cloud.consul.discovery.health-check-interval=2s
spring.cloud.consul.discovery.health-check-timeout=2s
spring.cloud.consul.discovery.health-check-critical-timeout=10s
spring.cloud.consul.discovery.query-passing=true
spring.cloud.consul.config.name=com/remal/springbox/@project.name@

################################################################################
# application monitoring
################################################################################
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted
management.endpoints.web.exposure.include=info,health,prometheus

################################################################################
# spring ssh-bundle configuration
################################################################################
# embedded web server
spring.ssl.bundle.jks.web-server.key.alias=${FQDN}
spring.ssl.bundle.jks.web-server.keystore.location=file:/tmp/${FQDN}.p12
spring.ssl.bundle.jks.web-server.keystore.password=changeit
spring.ssl.bundle.jks.web-server.keystore.type=PKCS12
# configure RestClient to use HTTPS correctly
spring.ssl.bundle.jks.rest-template.truststore.location=file:/tmp/${FQDN}.p12
spring.ssl.bundle.jks.rest-template.truststore.password=changeit
spring.ssl.bundle.jks.rest-template.truststore.type=PKCS12

################################################################################
# kafka
################################################################################
kafka.bootstrap.servers=kafka-4.remal.com:9092,kafka-5.remal.com:9092,kafka-6.remal.com:9092,kafka-7.remal.com:9092

kafka.topic.incoming.name=incoming
kafka.topic.incoming.partitions=3
kafka.topic.incoming.replicas=2
kafka.topic.incoming.retention.ms=604800000

kafka.topic.incoming.producer.acks=all
kafka.topic.incoming.producer.delivery.timeout.ms=120000
kafka.topic.incoming.producer.enable.idempotence=true
kafka.topic.incoming.producer.linger.ms=0
kafka.topic.incoming.producer.per.thread=false
kafka.topic.incoming.producer.request.timeout.ms=1000
kafka.topic.incoming.producer.retries=2147483647
kafka.topic.incoming.producer.retry.backoff.max.ms=5000
kafka.topic.incoming.producer.retry.backoff.ms=1000
